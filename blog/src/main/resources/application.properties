spring.application.name=blog
server.port=80
# 关闭静态资源缓存（开发排查“页面不更新/缓存”问题）
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
# MySQL ?????
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# MyBatis ??
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.muyu.blog.domain

# -----------------------------
# Tencent OCR
# -----------------------------
# 建议用环境变量注入，不要把真实密钥提交到代码库
tencent.ocr.secret-id=
tencent.ocr.secret-key=
# 临时密钥才需要（可选）
tencent.ocr.token=
tencent.ocr.region=
tencent.ocr.language=

# -----------------------------
# Upload (fix HTTP 413: Payload Too Large)
# -----------------------------
# Single file max size
spring.servlet.multipart.max-file-size=200MB
# Whole request max size (files + form fields)
spring.servlet.multipart.max-request-size=200MB
# Avoid Tomcat rejecting/aborting large multipart bodies
server.tomcat.max-swallow-size=-1
# Allow large application/x-www-form-urlencoded (not required for multipart, but safe)
server.tomcat.max-http-form-post-size=200MB

# -----------------------------
# AI 问答（Gemini / google-genai：先留空，后续你填入）
# -----------------------------
# Gemini API Key（先留空）
ai.gemini.api-key=
# Gemini 模型（按需改，例如：gemini-1.5-flash / gemini-1.5-pro）
ai.gemini.model=
# 采样温度
ai.gemini.temperature=
#
# Gemini 容错（处理 503/UNAVAILABLE “模型繁忙”）
#
# 最大重试次数（含第一次请求）
ai.gemini.retry.max-attempts=3
# 指数退避起始延迟（毫秒）
ai.gemini.retry.base-delay-ms=600
# 指数退避最大延迟（毫秒）
ai.gemini.retry.max-delay-ms=6000
# 单次请求超时（秒）
ai.gemini.request-timeout-seconds=30
# 备选模型（逗号分隔）：主模型繁忙时自动切换
ai.gemini.fallback-models=

# -----------------------------
# Gemini HTTP 代理（可选：先留空，后续你填入）
# -----------------------------
ai.gemini.proxy.host=
ai.gemini.proxy.port=
ai.gemini.proxy.username=
ai.gemini.proxy.password=
#
# 说明：如果远端出现 “AI 调用失败：HTTP 407”，而 curl 通过代理可以访问，
# 可能是远端 JDK（Java 11+）默认禁用了 Basic 的 HTTPS 代理隧道认证（CONNECT）。
# 可在启动命令中加入（两行任选其一或都加）：
#   -Djdk.http.auth.tunneling.disabledSchemes=
#   -Djdk.http.auth.proxying.disabledSchemes=